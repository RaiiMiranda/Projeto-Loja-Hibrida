        <header>
            <!-- start navbar -->
            <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top">

                    <img src="../img/kithara.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="index.html ">Início</a>
                            </li>
            
                            <li class="nav-item dropdown">
                                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Categorias</a>
                                <ul class="dropdown-menu">
                                    <li><a class="dropdown-item" href="#">Arcos</a></li>
                                    <li><a class="dropdown-item" href="#">Cordas</a></li>

                            <li class="nav-item">
                                <a class="nav-link" href="register.html">Cadastrar</a>
                            </li>

                            <li class="nav-item">

                            </li>

                            <li class="nav-item">
                                <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasScrolling" aria-controls="offcanvasScrolling">Carrinho</button>
                            </li>
                        </ul>

                        <form class="d-flex" role="search">
                            <input class="form-control me-2" type="search" placeholder="Procurar" aria-label="Search"/>
                            <button class="btn btn-outline-success" type="submit">Procurar</button>
                        </form>
                    </div>
                </div>
            </nav>
            <!-- end navbar -->

        <br><br>

        <!-- start main -->
        <main class="container d-flex justify-content-center mt-5">
            <div class="col-md-5">
                <h3 class="text-center mb-4">Adicionar um novo cartão</h3>

                <form>
                    <div class="mb-3">
                        <label class="form-label">Número do Cartão</label>
                        <input type="text" class="form-control" placeholder="0000 0000 0000 0000">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nome do Titular</label>
                        <input type="text" class="form-control" placeholder="Nome como no cartão">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Vencimento</label>
                            <input type="text" class="form-control" placeholder="MM/AA">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">CVV</label>
                            <input type="text" class="form-control" placeholder="123">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">CPF do Titular</label>
                        <input type="text" class="form-control" placeholder="000.000.000-00">
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-primary">Salvar Cartão</button>
                    </div>
                </form>
            </div>
        </main>
        <!-- end main -->

        <!-- start footer -->
        <footer>
            <br><hr><br>
            <p>footer virá em breve</p>
        </footer>
        <!-- end footer -->

        <!-- start scripts -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
