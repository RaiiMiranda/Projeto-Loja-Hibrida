<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Responsividade -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Links -->
        <link rel="stylesheet" href="css/style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <!-- Título -->
        <title> Pagamento - Kithara </title>
    </head>

    <body>
        <!-- start header -->
        <div id="header"></div>
        <!-- end header -->

        <br><br>

        <!-- start main -->
        <main>
            <br><h3 class="text-center mb-4">Finalizando seu Pedido</h3>

            <div class="container">
                <div class="row">
                    <!-- start tabela itens -->
                    <div class="col-md-8">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th scope="col">Produto</th>
                                    <th scope="col">Entrega</th>
                                    <th scope="col">Preço</th>
                                    <th scope="col">Quantidade</th>
                                    <th scope="col">Total</th>
                                </tr>
                            </thead>

                            <!-- start lista dinâmica dos produtos -->
                            <tbody id="productList"></tbody>
                            <!-- end lista dinâmica dos produtos -->
                        </table>
                    </div>
                    <!-- end tabela itens -->

                    <!-- start resumo pedido -->
                    <div class="col-md-4">
                        <div class="card p-3">
                            <h4 class="text-center">Resumo do Pedido</h4>

                            <div class="d-flex justify-content-between">
                                <p>Subtotal</p>
                                <p>R$ 1.499,97</p>
                            </div>

                            <hr>

                            <div class="d-flex justify-content-between">
                                <p>Taxa de Envio</p>
                                <p>Grátis</p>
                            </div>

                            <hr>

                            <div class="d-flex justify-content-between">
                                <strong>Total</strong>
                                <strong>R$ 1.499,97</strong>
                            </div>

                            <br>

                            <a href="paymentAddress.html" class="btn btn-primary">Continuar</a>
                        </div>
                    </div>
                    <!-- end resumo pedido -->
                </div>
            </div>

            <!-- start modal trocar endereço -->
            <div class="modal fade" id="exampleModalToggle" aria-hidden="true" aria-labelledby="exampleModalToggleLabel" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="exampleModalToggleLabel">Meu Endereço</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>

                        <div class="modal-body d-flex align-items-start">
                            <input type="radio" name="option" id="radio1" class="mt-1 me-3">

                            <div class="flex-grow-1">
                                <p class="mb-1 fw-bold">Nome e Telefone</p>
                                <p class="mb-2 text-muted">Endereço completo</p>
                                <button class="btn btn-primary" data-bs-target="#exampleModalToggle2" data-bs-toggle="modal">Editar</button>
                            </div>
                        </div>

                        <div class="modal-body d-flex align-items-start">
                            <input type="radio" name="option" id="radio1" class="mt-1 me-3">

                            <div class="flex-grow-1">
                                <p class="mb-1 fw-bold">Nome e Telefone</p>
                                <p class="mb-2 text-muted">Endereço completo</p>
                                <button class="btn btn-primary" data-bs-target="#exampleModalToggle2" data-bs-toggle="modal">Editar</button>
                            </div>
                        </div>

                        <div class="modal-footer">
                            <button class="btn btn-primary" data-bs-target="#exampleModalToggle2" data-bs-toggle="modal">Adicionar um novo endereço</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- end modal trocar endereço -->

            <!-- start modal editar/cadastrar novo endereço -->
            <div class="modal fade" id="exampleModalToggle2" aria-hidden="true" aria-labelledby="exampleModalToggleLabel2" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="exampleModalToggleLabel2">Editar/Novo Endereço</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>

                        <div class="modal-body">
                            <form class="row g-3">
                                <div class="mb-3">
                                    <label class="form-label">*Nome</label>
                                    <input type="text" class="form-control">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">*Número de Telefone</label>
                                    <input type="text" class="form-control">
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label">CEP</label>
                                    <input type="text" class="form-control">
                                </div>

                                <div class="col-8">
                                    <label class="form-label">*Endereço</label>
                                    <input type="text" class="form-control">
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label">*Número</label>
                                    <input type="text" class="form-control">
                                </div>

                                <div class="col-md-8">
                                    <label class="form-label">Complemento</label>
                                    <input type="text" class="form-control">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">*Bairro</label>
                                    <input type="text" class="form-control">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">*Cidade</label>
                                    <input type="text" class="form-control">
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label">*Estado</label>
                                    <select class="form-select">
                                    <option selected>Selecione...</option>
                                        <option>SP</option>
                                        <option>MG</option>
                                        <option>RJ</option>
                                    </select>
                                </div>

                                <div class="col-12 text-center mt-3">
                                    <button class="btn btn-primary" data-bs-target="#exampleModalToggle" data-bs-toggle="modal">Enviar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <!-- end modal editar/cadastrar novo endereço -->
        </main>
        <!-- end main -->

        <!-- start footer -->
        <footer>
            <br><hr><br>
            <p>footer virá em breve</p>
        </footer>
        <!-- end footer -->

        <!-- start scripts -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
       
        <script>
             // Buscando o pedido no backend
            async function loadCartItens() {
                // Pegando id da URL
                const params = new URLSearchParams(window.location.search);
                const orderId = params.get("id");

                try {
                    const response = await fetch(`http://localhost:3000/order/${orderId}`, {
                        credentials: "include"
                    });
                    
                    const items = await response.json();
                    console.log("ITENS DO PEDIDO:", items);

                    const container = document.getElementById("productList");
                    container.innerHTML = ""; // limpando antes

                    items.forEach(item => {
                        const total = item.price * item.quantity;

                        const tr = `
                            <tr>
                                <td>
                                    <img width="50" src="http://localhost:3000${item.image_url}">
                                    ${item.name}
                                </td>
                                <td>a calcular</td>
                                <td>R$ ${item.price}</td>
                                <td>${item.quantity}</td>
                                <td>R$ ${total.toFixed(2)}</td>
                            </tr>
                        `;

                        container.innerHTML += tr;
                    });

                } catch (error) {
                    console.error("Erro ao carregar produtos:", error);
                }
            }

            loadCartItens();
        </script>

        <!-- scripts para carregar o header -->
        <script src="../js/header.js"></script>
        <script>
            async function loadHeader() {
                const response = await fetch("../components/header.html");
                const data = await response.text();
                document.getElementById("header").innerHTML = data;
                
                initHeader();
            }

            loadHeader();
        </script>
        <!-- end scripts -->
    </body>
</html>
