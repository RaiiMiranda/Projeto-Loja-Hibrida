<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Responsividade -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Links -->
        <link rel="stylesheet" href="css/style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <!-- Título -->
        <title> Pagamento - Kithara </title>
    </head>

    <body>
        <!-- start header -->
        <div id="header"></div>
        <!-- end header -->

        <br><br>

        <!-- start main -->
        <main>
            <h3 class="text-center mb-4">Escolha o método de pagamento</h3>

            <div class="container">
                <div class="row">
                    <div class="col-md-8">
                        <div class="card p-3">
                            <h5 class="mb-3">Método de Pagamento</h5>

                            <div class="list-group">
                                <label class="list-group-item d-flex align-items-center gap-2">
                                    <input class="form-check-input" type="radio" name="payment">
                                    <span>Pix</span>
                                </label>

                                <label class="list-group-item d-flex align-items-center gap-2">
                                    <input class="form-check-input" type="radio" name="payment">
                                    <span>Boleto Bancário</span>
                                </label>

                                <label class="list-group-item d-flex align-items-center gap-2">
                                    <input class="form-check-input" type="radio" name="payment">
                                    <span>Cartão de Crédito</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="card p-3">
                            <h5 class="text-center mb-3">Resumo do Pedido</h5>

                            <div class="d-flex justify-content-between">
                                <span>Subtotal</span>
                                <span>R$ 1.499,97</span>
                            </div>

                            <div class="d-flex justify-content-between">
                                <span>Frete</span>
                                <span>Grátis</span>
                            </div>

                            <hr>

                            <div class="d-flex justify-content-between">
                                <strong>Total</strong>
                                <strong>R$ 1.499,97</strong>
                            </div>

                            <button class="btn btn-primary w-100 mt-3">Finalizar Compra</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- start modal trocar endereço -->
            <div class="modal fade" id="exampleModalToggle" aria-hidden="true" aria-labelledby="exampleModalToggleLabel" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="exampleModalToggleLabel">Meu Endereço</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>

                        <div class="modal-body d-flex align-items-start">
                            <input type="radio" name="option" id="radio1" class="mt-1 me-3">

                            <div class="flex-grow-1">
                                <p class="mb-1 fw-bold">Nome e Telefone</p>
                                <p class="mb-2 text-muted">Endereço completo</p>
                                <button class="btn btn-primary" data-bs-target="#exampleModalToggle2" data-bs-toggle="modal">Editar</button>
                            </div>
                        </div>

                        <div class="modal-body d-flex align-items-start">
                            <input type="radio" name="option" id="radio1" class="mt-1 me-3">

                            <div class="flex-grow-1">
                                <p class="mb-1 fw-bold">Nome e Telefone</p>
                                <p class="mb-2 text-muted">Endereço completo</p>
                                <button class="btn btn-primary" data-bs-target="#exampleModalToggle2" data-bs-toggle="modal">Editar</button>
                            </div>
                        </div>

                        <div class="modal-footer">
                            <button class="btn btn-primary" data-bs-target="#exampleModalToggle2" data-bs-toggle="modal">Adicionar um novo endereço</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- end modal trocar endereço -->

            <!-- start modal editar/cadastrar novo endereço -->
            <div class="modal fade" id="exampleModalToggle2" aria-hidden="true" aria-labelledby="exampleModalToggleLabel2" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="exampleModalToggleLabel2">Editar/Novo Endereço</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>

                        <div class="modal-body">
                            <form class="row g-3">
                                <div class="mb-3">
                                    <label class="form-label">*Nome</label>
                                    <input type="text" class="form-control">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">*Número de Telefone</label>
                                    <input type="text" class="form-control">
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label">CEP</label>
                                    <input type="text" class="form-control">
                                </div>

                                <div class="col-8">
                                    <label class="form-label">*Endereço</label>
                                    <input type="text" class="form-control">
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label">*Número</label>
                                    <input type="text" class="form-control">
                                </div>

                                <div class="col-md-8">
                                    <label class="form-label">Complemento</label>
                                    <input type="text" class="form-control">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">*Bairro</label>
                                    <input type="text" class="form-control">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">*Cidade</label>
                                    <input type="text" class="form-control">
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label">*Estado</label>
                                    <select class="form-select">
                                    <option selected>Selecione...</option>
                                        <option>SP</option>
                                        <option>MG</option>
                                        <option>RJ</option>
                                    </select>
                                </div>

                                <div class="col-12 text-center mt-3">
                                    <button class="btn btn-primary" data-bs-target="#exampleModalToggle" data-bs-toggle="modal">Enviar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <!-- end modal editar/cadastrar novo endereço -->
        </main>
        <!-- end main -->

        <!-- start footer -->
        <footer>
            <br><hr><br>
            <p>footer virá em breve</p>
        </footer>
        <!-- end footer -->

        <!-- start scripts -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        
        <!-- scripts para carregar o header -->
        <script src="../js/header.js"></script>
        <script>
            async function loadHeader() {
                const response = await fetch("../components/header.html");
                const data = await response.text();
                document.getElementById("header").innerHTML = data;
                
                initHeader();
            }

            loadHeader();
        </script>
        <!-- end scripts -->
    </body>
</html>
