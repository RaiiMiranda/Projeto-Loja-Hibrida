<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Responsividade -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Links -->
        <link rel="stylesheet" href="../css/style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <!-- Título -->
        <title> Kithara - Loja de Instrumentos </title>
    </head>

    <body>
        <!-- start header -->
        <header>
            <!-- start navbar -->
            <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top">
                <div class="container-fluid">
                    <img src="../img/kithara.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                    <a class="navbar-brand" href="index.html">Kithara</a>

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>
            </nav>
            <!-- end navbar -->
        </header>
        <!-- end header -->

        <!-- start main -->
        <main>
            <!-- start principal -->
            <div class="container-fluid mt-4"> <br><br>
                <div class="row">
                    <!-- start filtro -->
                    <div class="col-md-3">
                        <div class="filtro border rounded p-3 shadow-sm bg-light">
                            <h3>Portal do Vendedor</h3>
                            <div class="list-group">
                                <a href="sellerDashboard.html" class="list-group-item list-group-item-action">Dashboard</a>
                                <a href="sellerOrders.html" class="list-group-item list-group-item-action">Pedidos</a>
                                <a href="sellerProducts.html" class="list-group-item list-group-item-action active" aria-current="true">Produtos</a>
                                <a href="sellerProfile.html" class="list-group-item list-group-item-action">Perfil</a>

                                <a href="#" class="list-group-item list-group-item-action">Sair</a>
                            </div>
                        </div>
                    </div>
                    <!-- end filtro -->

                    <!-- start products -->
                    <div class="col-md-9">
                        <h3 class="mb-4">Produtos Loja Física</h3>

                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th scope="col">Produto</th>
                                    <th scope="col">Categoria</th>
                                    <th scope="col">Preço</th>
                                    <th scope="col">Estoque</th>
                                    <th scope="col">Ações</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr>
                                    <th scope="row"><img width="50px" height="50px" src="../img/guitarra.jpg" alt=""> Produto 01</th>
                                    <td>Corda</td>
                                    <td>R$ 499,99</td>
                                    <td><input type="number" value="1"></td>
                                    <td><button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalEdit">Editar</button><button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalDelete">Apagar</button></td>
                                </tr>
                                <tr>
                                    <th scope="row"><img width="50px" height="50px" src="../img/arco.webp" alt=""> Produto 02</th>
                                    <td>Arco</td>
                                    <td>R$ 699,99</td>
                                    <td><input type="number" value="1"></td>
                                    <td><button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalEdit">Editar</button><button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalDelete">Apagar</button></td>
                                </tr>
                            </tbody>
                        </table>

                        <nav aria-label="...">
                            <ul class="pagination">
                                <li class="page-item"><a href="#" class="page-link">Anterior</a></li>
                                <li class="page-item"><a class="page-link" href="#" aria-current="page">1</a></li>
                                <li class="page-item active"><a class="page-link" href="#">2</a></li>
                                <li class="page-item"><a class="page-link" href="#">3</a></li>
                                <li class="page-item"><a class="page-link" href="#">Próximo</a></li>
                            </ul>
                        </nav>
                    </div>
                    <!-- end products -->
                </div>
            </div>
            <!-- end principal -->

            <!-- start modal edit -->
            <div class="modal fade" id="modalEdit" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="exampleModalLabel">Editar Produto</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <input type="text" placeholder="Nome do produto">
                            <input type="text" placeholder="Categoria do produto">
                            <input type="text" placeholder="Marca do produto">
                            <input type="number" placeholder="Preço do produto">
                            <input type="text" placeholder="Condição Novo/Usado">
                            <input type="text" placeholder="Descrição do produto">
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Salvar Atualizações</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- start modal edit -->

            <!-- start modal delete -->
            <div class="modal fade" id="modalDelete" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="exampleModalLabel">Produto apagado com sucesso!</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- start modal delete -->
        </main>
        <!-- end main -->

        <!-- start scripts -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <!-- end scripts -->
    </body>
</html>
