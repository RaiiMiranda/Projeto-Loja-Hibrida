<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Responsividade -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Links -->
        <link rel="stylesheet" href="../css/style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <!-- Título -->
        <title> Kithara - Loja de Instrumentos </title>
    </head>

    <body>
        <!-- start header -->
        <header>
            <!-- start navbar -->
            <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top">
                <div class="container-fluid">
                    <img src="../img/kithara.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                    <a class="navbar-brand" href="index.html">Kithara</a>

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>
            </nav>
            <!-- end navbar -->
        </header>
        <!-- end header -->

        <!-- start main -->
        <main>
            <!-- start principal -->
            <div class="container-fluid mt-5 pt-3">
                <div class="row">
                    <!-- start filtro -->
                    <div class="col-md-3">
                        <div class="filtro border rounded p-3 shadow-sm bg-light">
                            <h3>Admin Portal</h3>
                            
                            <!-- start painel admin dinâmico -->
                            <div id="listGroup"></div>
                            <!-- end painel admin dinâmico -->
                        </div>
                    </div>
                    <!-- end filtro -->

                    <!-- start products -->
                    <div class="col-md-9">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h3 class="mb-0">Categorias</h3>

                            <!-- ações -->
                            <div class="d-flex flex-wrap gap-2 justify-content-end">
                                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNewCategory">Nova Categoria</button>
                            </div>
                        </div>

                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th scope="col">Categoria</th>
                                    <th scope="col">Ações</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr>
                                    <td>Corda</td>
                                    <td>
                                        <button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#modalEdit">Editar</button>
                                        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalDelete">Excluir</button>
                                    </td>
                                </tr>
                                <tr>
                                    <td>Arco</td>
                                    <td>
                                        <button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#modalEdit">Editar</button>
                                        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalDelete">Excluir</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>

                        <!-- start accordion -->
                        <div class="accordion accordion-flush" id="accordionFlushExample">
                            <!-- start 01 -->
                            <div class="accordion-item">
                                <h2 class="accordion-header">
                                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseOne" aria-expanded="false" aria-controls="flush-collapseOne">
                                        Guitarras
                                    </button>
                                </h2>
                                <div id="flush-collapseOne" class="accordion-collapse collapse" data-bs-parent="#accordionFlushExample">
                                    <div class="accordion-body">
                                        <div class="card" style="width: 18rem;">
                                            <div class="card-body">
                                                <p>Elétricas</p>
                                                <p>Semi-acústica</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- start 02 -->
                            <div class="accordion-item">
                                <h2 class="accordion-header">
                                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseTwo" aria-expanded="false" aria-controls="flush-collapseTwo">
                                        Baterias
                                    </button>
                                </h2>
                                <div id="flush-collapseTwo" class="accordion-collapse collapse" data-bs-parent="#accordionFlushExample">
                                    <div class="accordion-body">
                                        <div class="card" style="width: 18rem;">
                                            <div class="card-body">
                                                <p>Baterias Acústicas</p>
                                                <p>Baterias Eletrônicas</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- end accordion -->

                        <nav aria-label="...">
                            <ul class="pagination">
                                <li class="page-item"><a href="#" class="page-link">Anterior</a></li>
                                <li class="page-item"><a class="page-link" href="#" aria-current="page">1</a></li>
                                <li class="page-item active"><a class="page-link" href="#">2</a></li>
                                <li class="page-item"><a class="page-link" href="#">3</a></li>
                                <li class="page-item"><a class="page-link" href="#">Próximo</a></li>
                            </ul>
                        </nav>
                    </div>
                    <!-- end products -->
                </div>
            </div>
            <!-- end principal -->

            <!-- start modal new category -->
            <div class="modal fade" id="modalNewCategory" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="modalNewCategory">Nova Categoria</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label">Nome da Categoria</label>
                                <input type="text" class="form-control" placeholder="Ex.: Sopros, Áudio...">
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Salvar Atualizações</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- start modal new category -->

            <!-- start modal edit -->
            <div class="modal fade" id="modalEdit" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="exampleModalLabel">Editar Categoria</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label">Nome da Categoria</label>
                                <input type="text" class="form-control" placeholder="Ex.: Sopros, Áudio...">
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Salvar Atualizações</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- start modal edit -->

            <!-- start modal delete -->
            <div class="modal fade" id="modalDelete" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="exampleModalLabel">Tem certeza que deseja excluir?</h1>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Excluir</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- start modal delete -->
        </main>
        <!-- end main -->

        <!-- start scripts -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        
        <!-- scripts para carregar o list group -->
        <script src="../js/adminPortal.js"></script>
        <script>
            async function loadListGroup() {
                const response = await fetch("../components/adminPortal.html"); // pedindo o adminPortal
                const data = await response.text();                             // converte o pedido para texto HTML
                document.getElementById("listGroup").innerHTML = data;          // injetando o adminPortal.html
                
                initListGroup();
            }

            // Chamando a função assim que carrega a página
            loadListGroup(); 
        </script>
        <!-- end scripts -->
    </body>
</html>
