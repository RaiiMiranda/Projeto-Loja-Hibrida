<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Responsividade -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Links -->
        <link rel="stylesheet" href="../css/style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <!-- Título -->
        <title> Kithara - Loja de Instrumentos </title>
    </head>

    <body>
        <!-- start header -->
        <div id="header"></div>
        <!-- end header -->

        <!-- start main -->
        <main>
            <!-- start principal -->
            <div class="container-fluid mt-4"> <br><br>
                <div class="row">
                    <!-- start filtro -->
                    <div class="col-md-3">
                        <div class="filtro border rounded p-3 shadow-sm bg-light">
                            <h3>Minha Conta</h3>
                            <div class="list-group">
                                <a href="userProfile.html" class="list-group-item list-group-item-action">Perfil</a>
                                <a href="userOrders.html" class="list-group-item list-group-item-action">Meus Pedidos</a>
                                <a href="userReviews.html" class="list-group-item list-group-item-action active" aria-current="true">Minhas avaliações</a>
                                <a href="userAddress.html" class="list-group-item list-group-item-action">Endereços</a>

                                <a href="#" class="list-group-item list-group-item-action">Sair</a>
                            </div>
                        </div>
                    </div>
                    <!-- end filtro -->

                    <!-- start reviews -->
                    <div class="col-md-9">
                        <h3 class="mb-4">Minhas Avaliações</h3>

                        <img src="/img/guitarra.jpg" width="50px" alt="Product">
                        <p>Nome do produto</p>
                        <p>⭐ ⭐ ⭐ ⭐ ⭐</p>
                        <p>Avaliação do cliente</p>
                        <p>XX/XX/XXXX</p>
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalEdit">Editar</button>
                        <button class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#modalDelete">Excluir</button>
                    </div>
                    <!-- end reviews -->
                </div>
            </div>
            <!-- end principal -->

            <!-- start modal review -->
            <div class="modal fade" id="modalEdit" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="exampleModalLabel">Editar Avaliação</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <p>⭐ ⭐ ⭐ ⭐ ⭐</p>
                            <h1 class="modal-title fs-5" id="exampleModalLabel">O que achou deste produto?</h1>
                            <div class="form-floating">
                                <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea2" style="height: 100px"></textarea>
                                <label for="floatingTextarea2">Comentário</label>
                            </div>

                            <br><p>Serviço de entrega ⭐ ⭐ ⭐ ⭐ ⭐</p>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Enviar</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- start modal review -->

            <!-- start modal delete -->
            <div class="modal fade" id="modalDelete" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="exampleModalLabel">Tem certeza que deseja excluir?</h1>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Excluir</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- start modal delete -->
        </main>
        <!-- end main -->

        <!-- start footer -->
        <footer>
            <br><hr><br>
            <p>footer virá em breve</p>
        </footer>
        <!-- end footer -->

        <!-- start scripts -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        
        <!-- scripts para carregar o header -->
        <script src="../js/header.js"></script>
        <script>
            async function loadHeader() {
                const response = await fetch("../components/header.html");
                const data = await response.text();
                document.getElementById("header").innerHTML = data;
                
                initHeader();
            }

            loadHeader();
        </script>
        <!-- end scripts -->
    </body>
</html>
