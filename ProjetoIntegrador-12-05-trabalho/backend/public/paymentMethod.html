<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Responsividade -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Links -->
        <link rel="stylesheet" href="css/style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <!-- Título -->
        <title> Pagamento - Kithara </title>
    </head>

    <body>
        <!-- start header -->
        <div id="header"></div>
        <!-- end header -->

        <br><br>

        <!-- start main -->
        <main>
            <h3 class="text-center mb-4 mt-4">Escolha o método de pagamento</h3>

            <div class="container">
                <div class="row">
                    <div class="col-md-8">
                        <div class="card p-3">
                            <h5 class="mb-3">Método de Pagamento</h5>

                            <div class="list-group">
                                <label class="list-group-item d-flex align-items-center gap-2">
                                    <input class="form-check-input" type="radio" name="payment">
                                    <span>Pix</span>
                                </label>

                                <label class="list-group-item d-flex align-items-center gap-2">
                                    <input class="form-check-input" type="radio" name="payment">
                                    <span>Boleto Bancário</span>
                                </label>

                                <label class="list-group-item d-flex align-items-center gap-2">
                                    <input class="form-check-input" type="radio" name="payment">
                                    <span>Cartão de Crédito</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="card p-3">
                            <h5 class="text-center mb-3">Resumo do Pedido</h5>

                            <div class="d-flex justify-content-between">
                                <span>Subtotal</span>
                                <span>R$ 1.499,97</span>
                            </div>

                            <div class="d-flex justify-content-between">
                                <span>Frete</span>
                                <span>Grátis</span>
                            </div>

                            <hr>

                            <div class="d-flex justify-content-between">
                                <strong>Total</strong>
                                <strong>R$ 1.499,97</strong>
                            </div>

                            <div class="mb-3">
                                <a href="payment.html" class="btn btn-primary w-100 mt-4">Continuar pedido</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <!-- end main -->

        <!-- start footer -->
        <footer>
            <br><hr><br>
            <p>footer virá em breve</p>
        </footer>
        <!-- end footer -->

        <!-- start scripts -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        
        <!-- scripts para carregar o header -->
        <script src="../js/header.js"></script>
        <script>
            async function loadHeader() {
                const response = await fetch("../components/header.html");
                const data = await response.text();
                document.getElementById("header").innerHTML = data;
                
                initHeader();
            }

            loadHeader();
        </script>
        <!-- end scripts -->
    </body>
</html>
