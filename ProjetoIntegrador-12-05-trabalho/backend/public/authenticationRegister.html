<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Links -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <title> Cadastro - Kithara </title>
    </head>

    <body>
        <!-- start header -->
        <div id="header"></div>
        <!-- end header -->

        <br> <br>

        <!-- start main -->
        <main class="container d-flex justify-content-center mt-5">
            <!-- start formulário -->
            <div class="col-md-6">
                <!-- start dados do cliente -->
                <h3 class="text-center mb-4">Dados do Cliente</h3>

                <form class="mb-5" id="registerForm" method="POST" action="http://localhost:3000/user">
                    <div class="mb-3">
                        <label class="form-label">*Nome</label>
                        <input type="text" class="form-control" name="name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">*Email</label>
                        <input type="email" class="form-control" name="email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">*Confirmar Email</label>
                        <input type="email" class="form-control" name="confirmEmail">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">*Número de Telefone</label>
                        <input type="text" class="form-control" name="phone" placeholder="(12) 99999-9999">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">*CPF</label>
                        <input type="text" class="form-control" name="cpf" placeholder="000.000.000-00">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">*Senha</label>
                        <input type="password" class="form-control" name="password" minlength="6">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">*Confirmar Senha</label>
                        <input type="password" class="form-control" name="confirmPassword" minlength="6">
                    </div>

                    <div class="col-12 text-center mt-3">
                        <button type="submit" class="btn btn-primary">Finalizar Cadastro</button>
                    </div>
                </form>
                <!-- end dados do cliente -->
            </div>
            <!-- end formulário -->
        </main>
        <!-- end main -->

        <!-- start footer -->
        <footer>
            <br><hr><br>
            <p>footer virá em breve</p>
        </footer>
        <!-- end footer -->

        <!-- start scripts -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        
        <script>
            const form = document.getElementById("registerForm"); // pegando o formulário

            // Adicionando evento de enviar
            form.addEventListener("submit", async (e) => {
                e.preventDefault(); // impedindo comportamento padrão do form (recarregar a página)

                const data = Object.fromEntries(new FormData(form)); // transformando o formulário em objeto JS

                // Mandando os dados do formulário para o backend criar o usuário
                const response = await fetch("http://localhost:3000/user", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json" // diz que está enviando json
                    },
                    body: JSON.stringify(data) // convertendo o objeto JS em JSON
                });

                const result = await response.json(); // pegando resposta de sucesso ou erro

                // Se der erro, manda mensagem de erro
                if (!response.ok) {
                    alert(result.error);
                    return;
                }

                // Se der certo, manda para a página de login
                window.location.href = "authenticationLogin.html";
            });
        </script>

        <!-- scripts para carregar o header -->
        <script src="../js/header.js"></script>
        <script>
            async function loadHeader() {
                const response = await fetch("../components/header.html");
                const data = await response.text();
                document.getElementById("header").innerHTML = data;
                
                initHeader();
            }

            loadHeader();
        </script>
        <!-- end scripts -->
    </body>
</html>
