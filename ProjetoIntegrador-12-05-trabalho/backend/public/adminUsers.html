<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Responsividade -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Links -->
        <link rel="stylesheet" href="../css/style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <!-- Título -->
        <title> Kithara - Loja de Instrumentos </title>
    </head>

    <body>
        <!-- start header -->
        <header>
            <!-- start navbar -->
            <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top">
                <div class="container-fluid">
                    <img src="../img/kithara.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                    <a class="navbar-brand" href="index.html">Kithara</a>

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>
            </nav>
            <!-- end navbar -->
        </header>
        <!-- end header -->

        <!-- start main -->
        <main>
            <!-- start principal -->
            <div class="container-fluid mt-5 pt-3">
                <div class="row">
                    <!-- start filtro -->
                    <div class="col-md-3">
                        <div class="filtro border rounded p-3 shadow-sm bg-light">
                            <h3>Admin Portal</h3>
                            
                            <!-- start painel admin dinâmico -->
                            <div id="listGroup"></div>
                            <!-- end painel admin dinâmico -->
                        </div>
                    </div>
                    <!-- end filtro -->

                    <!-- start users -->
                    <div class="col-md-9">
                        <h3 class="mb-4">Usuários</h3>

                        <table class="table table-striped table-bordered">
                            <thead>
                                <tr>
                                    <th scope="col"">Id</th>
                                    <th scope="col">Nome</th>
                                    <th scope="col">Tipo</th>
                                    <th scope="col">CPF</th>
                                    <th scope="col">Email</th>
                                    <th scope="col">Telefone</th>
                                    <th scope="col">Registrado em</th>
                                    <th scope="col">Ações</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr>
                                    <th>1</th>
                                    <td>Nome do Usuário</td>
                                    <td>Cliente/Admin</td>
                                    <td>000.000.000-00</td>
                                    <td>email@email.com</td>
                                    <td>(XX) XXXXX-XXXX</td>
                                    <td>XX/XX/XXXX</td>
                                    <td>
                                        <select class="form-select">
                                            <option selected>Ativo</option>
                                            <option>Desativado</option>
                                        </select>
                                    </td>
                                </tr>
                            </tbody>
                        </table>

                        <a href="#" class="btn btn-primary">Salvar Atualizações</a> <br><br>

                        <nav aria-label="...">
                            <ul class="pagination">
                                <li class="page-item"><a href="#" class="page-link">Anterior</a></li>
                                <li class="page-item"><a class="page-link" href="#" aria-current="page">1</a></li>
                                <li class="page-item active"><a class="page-link" href="#">2</a></li>
                                <li class="page-item"><a class="page-link" href="#">3</a></li>
                                <li class="page-item"><a class="page-link" href="#">Próximo</a></li>
                            </ul>
                        </nav>
                    </div>
                    <!-- end users -->
                </div>
            </div>
            <!-- end principal -->
        </main>
        <!-- end main -->

        <!-- start scripts -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        
        <!-- scripts para carregar o list group -->
        <script src="../js/adminPortal.js"></script>
        <script>
            async function loadListGroup() {
                const response = await fetch("../components/adminPortal.html"); // pedindo o adminPortal
                const data = await response.text();                             // converte o pedido para texto HTML
                document.getElementById("listGroup").innerHTML = data;          // injetando o adminPortal.html
                
                initListGroup();
            }

            // Chamando a função assim que carrega a página
            loadListGroup(); 
        </script>
        <!-- end scripts -->
    </body>
</html>
