<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Responsividade -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Links -->
        <link rel="stylesheet" href="../css/style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <!-- Título -->
        <title> Kithara - Loja de Instrumentos </title>
    </head>

    <body>
        <!-- start header -->
        <div id="header"></div>
        <!-- end header -->

        <!-- start main -->
        <main>
            <!-- start principal -->
            <div class="container-fluid mt-4"> <br><br>
                <div class="row">
                    <!-- start filtro -->
                    <div class="col-md-3">
                        <div class="filtro border rounded p-3 shadow-sm bg-light">
                            <h3>Minha Conta</h3>
                            <div class="list-group">
                                <a href="userProfile.html" class="list-group-item list-group-item-action">Perfil</a>
                                <a href="userOrders.html" class="list-group-item list-group-item-action">Meus Pedidos</a>
                                <a href="userReviews.html" class="list-group-item list-group-item-action">Minhas avaliações</a>
                                <a href="userAddress.html" class="list-group-item list-group-item-action active" aria-current="true">Endereços</a>

                                <a href="#" class="list-group-item list-group-item-action">Sair</a>
                            </div>
                        </div>
                    </div>
                    <!-- end filtro -->

                    <!-- start address -->
                    <div class="col-md-9">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h3 class="mb-0">Endereços</h3>

                            <!-- ações -->
                            <div class="d-flex flex-wrap gap-2 justify-content-end">
                                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalEdit">Novo Endereço</button>
                            </div>
                        </div>

                        <div class="form-check col-md-4">
                            <input class="form-check-input" type="radio">
                            <p>Nome da Pessoa | (XX) XXXXX-XXXX</p>
                            <p>Endereço completo</p>
                            <a href="#" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalEdit">Editar</a>
                            <a href="#" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#modalDelete">Excluir</a>
                        </div>

                        <div class="form-check col-md-4 mt-4">
                            <input class="form-check-input" type="radio">
                            <p>Nome da Pessoa | (XX) XXXXX-XXXX</p>
                            <p>Endereço completo</p>
                            <a href="#" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalEdit">Editar</a>
                            <a href="#" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#modalDelete">Excluir</a>
                        </div>
                    </div>
                    <!-- end address -->
                </div>
            </div>
            <!-- end principal -->

            <!-- start modal editar/cadastrar novo endereço -->
            <div class="modal fade" id="modalEdit" aria-hidden="true" aria-labelledby="exampleModalToggleLabel2" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="exampleModalToggleLabel2">Editar/Novo Endereço</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>

                        <div class="modal-body">
                            <form class="row g-3">
                                <div class="mb-3">
                                    <label class="form-label">*Nome</label>
                                    <input type="text" class="form-control">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">*Número de Telefone</label>
                                    <input type="text" class="form-control">
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label">CEP</label>
                                    <input type="text" class="form-control">
                                </div>

                                <div class="col-8">
                                    <label class="form-label">*Endereço</label>
                                    <input type="text" class="form-control">
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label">*Número</label>
                                    <input type="text" class="form-control">
                                </div>

                                <div class="col-md-8">
                                    <label class="form-label">Complemento</label>
                                    <input type="text" class="form-control">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">*Bairro</label>
                                    <input type="text" class="form-control">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">*Cidade</label>
                                    <input type="text" class="form-control">
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label">*Estado</label>
                                    <select class="form-select">
                                    <option selected>Selecione...</option>
                                        <option>SP</option>
                                        <option>MG</option>
                                        <option>RJ</option>
                                    </select>
                                </div>

                                <div class="col-12 text-center mt-3">
                                    <button class="btn btn-primary" data-bs-target="#exampleModalToggle" data-bs-toggle="modal">Salvar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <!-- end modal editar/cadastrar novo endereço -->

            <!-- start modal delete -->
            <div class="modal fade" id="modalDelete" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="exampleModalLabel">Tem certeza que deseja excluir?</h1>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Excluir</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- start modal delete -->
        </main>
        <!-- end main -->

        <!-- start footer -->
        <footer>
            <br><hr><br>
            <p>footer virá em breve</p>
        </footer>
        <!-- end footer -->

        <!-- start scripts -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        
        <!-- scripts para carregar o header -->
        <script src="../js/header.js"></script>
        <script>
            async function loadHeader() {
                const response = await fetch("../components/header.html");
                const data = await response.text();
                document.getElementById("header").innerHTML = data;
                
                initHeader();
            }

            loadHeader();
        </script>
        <!-- end scripts -->
    </body>
</html>
