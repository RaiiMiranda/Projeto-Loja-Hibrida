<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Responsividade -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Links -->
        <link rel="stylesheet" href="../css/style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <!-- Título -->
        <title> Kithara - Loja de Instrumentos </title>
    </head>

    <body>
        <!-- start header -->
        <header>
            <!-- start navbar -->
            <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top">
                <div class="container-fluid">
                    <img src="../img/kithara.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                    <a class="navbar-brand" href="index.html">Kithara</a>

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>
            </nav>
            <!-- end navbar -->
        </header>
        <!-- end header -->

        <!-- start main -->
        <main>
            <!-- start principal -->
            <div class="container-fluid mt-4"> <br><br>
                <div class="row">
                    <!-- start filtro -->
                    <div class="col-md-3">
                        <div class="filtro border rounded p-3 shadow-sm bg-light">
                            <h3>Portal do Vendedor</h3>
                            <div class="list-group">
                                <a href="sellerDashboard.html" class="list-group-item list-group-item-action">Dashboard</a>
                                <a href="sellerOrders.html" class="list-group-item list-group-item-action">Pedidos</a>
                                <a href="sellerProducts.html" class="list-group-item list-group-item-action">Produtos</a>
                                <a href="sellerProfile.html" class="list-group-item list-group-item-action active" aria-current="true">Perfil</a>

                                <a href="#" class="list-group-item list-group-item-action">Sair</a>
                            </div>
                        </div>
                    </div>
                    <!-- end filtro -->

                    <!-- start users -->
                    <div class="col-md-9">
                        <h3 class="mb-4">Perfil</h3>

                        <p>Vendedor</p>
                        <p>Email: seller@gmail.com</p>
                        <p>Função: Vendedor</p>

                        <br><br>

                        <h3 class="mb-4">Editar Perfil</h3>
                        <form action="">
                            <label for="">Nome</label>
                            <input type="text" name="" id="">

                            <label for="">Email</label>
                            <input type="email" name="" id="">

                            <label for="">Confirmar Email</label>
                            <input type="email" name="" id="">

                            <button type="submit" class="btn btn-primary">Enviar</button>
                        </form>

                        <br><br>

                        <h3 class="mb-4">Alterar Senha</h3>
                        <form action="">
                            <label for="">Senha Atual</label>
                            <input type="text" name="" id="">

                            <label for="">Nova Senha</label>
                            <input type="email" name="" id="">

                            <label for="">Confirmar Nova Senha</label>
                            <input type="email" name="" id="">

                            <button type="submit" class="btn btn-primary">Enviar</button>
                        </form>
                    </div>
                    <!-- end users -->
                </div>
            </div>
            <!-- end principal -->
        </main>
        <!-- end main -->

        <!-- start scripts -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <!-- end scripts -->
    </body>
</html>
