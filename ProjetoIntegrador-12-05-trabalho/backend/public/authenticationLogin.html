<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Links -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <title> Login - Kithara </title>
    </head>

    <body>
        <!-- start header -->
        <div id="header"></div>
        <!-- end header -->

        <br> <br>

        <!-- start main -->
        <main>
            <div class="container d-flex justify-content-center mt-5">
                <div class="col-md-6">
                    <h3 class="text-center mb-4">Login</h3>

                    <form class="mb-5" id="loginForm" method="POST" action="http://localhost:3000/auth/login">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Senha</label>
                            <input type="password" class="form-control" name="password">
                        </div>
                        <div class="col-12 text-center mt-3">
                            <input type="submit" value="Login" class="btn btn-primary">
                        </div>
                    </form>
                    <div class="col-12 text-center mt-3">
                        <p>Esqueceu a senha? <a href="#">Clique aqui para recuperá-la</a></p>
                    </div>
                </div>
            </div>

            <br> <br>

            <h3 class="text-center mb-4">Ainda não tem cadastro?</h3>
            <div class="col-12 text-center mt-3">
                <a href="register.html" class="btn btn-primary">Cadastrar</a>
            </div>
        </main>
        <!-- end main -->

       <!-- start footer -->
        <footer>
            <br><hr><br>
            <p>footer virá em breve</p>
        </footer>
        <!-- end footer -->

        <!-- start scripts -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        
        <script>
            // Adicionando evento de enviar
            document.getElementById("loginForm").addEventListener("submit", async function(e) {
                e.preventDefault(); // impede reload da página

                const email = document.querySelector('input[name="email"]').value;
                const password = document.querySelector('input[name="password"]').value;

                try {
                    // Envia login para o backend
                    const response = await fetch("http://localhost:3000/auth/login", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        credentials: "include",
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json(); // resposta do backend

                    if (!response.ok) {
                        alert(data.error);
                        return;
                    }

                    // Salvando o usuário no navegador, para conseguir usar seus dados no HTML
                    localStorage.setItem("user", JSON.stringify(data.user));

                    window.location.href = "index.html";

                } catch (error) {
                    console.error(error);
                    alert("Erro ao fazer login");
                }
            });
        </script>

        <!-- scripts para carregar o header -->
        <script src="../js/header.js"></script>
        <script>
            async function loadHeader() {
                const response = await fetch("../components/header.html");
                const data = await response.text();
                document.getElementById("header").innerHTML = data;
                
                initHeader();
            }

            loadHeader();
        </script>
        <!-- end scripts -->
    </body>
</html>
