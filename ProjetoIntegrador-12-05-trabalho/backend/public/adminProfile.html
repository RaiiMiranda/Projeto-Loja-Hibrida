<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Responsividade -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Links -->
        <link rel="stylesheet" href="../css/style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <!-- Título -->
        <title> Kithara - Loja de Instrumentos </title>
    </head>

    <body>
        <!-- start header -->
        <header>
            <!-- start navbar -->
            <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top">
                <div class="container-fluid">
                    <img src="../img/kithara.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                    <a class="navbar-brand" href="index.html">Kithara</a>

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>
            </nav>
            <!-- end navbar -->
        </header>
        <!-- end header -->

        <!-- start main -->
        <main>
            <!-- start principal -->
            <div class="container-fluid mt-5 pt-3">
                <div class="row">
                    <!-- start filtro -->
                    <div class="col-md-3">
                        <div class="filtro border rounded p-3 shadow-sm bg-light">
                            <h3>Admin Portal</h3>
                            
                            <!-- start painel admin dinâmico -->
                            <div id="listGroup"></div>
                            <!-- end painel admin dinâmico -->
                        </div>
                    </div>
                    <!-- end filtro -->

                    <!-- start users -->
                    <div class="col-md-6">
                        <h3 class="mb-4">Perfil</h3>

                        <p>Admin</p>
                        <p>Email: admin@gmail.com</p>
                        <p>Função: Admin</p>

                        <br>

                        <h3 class="mb-4">Editar Perfil</h3>
                        <form class="mb-5" method="POST" id="updateForm">
                            <div class="mb-3">
                                <label class="form-label">Nome</label>
                                <input class="form-control" type="text" name="name" id="">
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input class="form-control" type="email" name="newEmail" id="">
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Confirmar Email</label>
                                <input class="form-control" type="email" name="confirmEmail" id="">
                            </div>

                            <button type="submit" class="btn btn-primary">Salvar alterações</button>
                        </form>

                        <h3 class="mb-4">Alterar Senha</h3>
                        <form class="mb-5" method="POST" id="updateForm">
                            <div class="mb-3">
                                <label class="form-label">Senha Atual</label>
                                <input class="form-control" minlength="6" type="text" name="currentPassword" id="">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Nova Senha</label>
                                <input class="form-control" minlength="6" type="text" name="newPassword" id="">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Confirmar Nova Senha</label>
                                <input class="form-control" minlength="6" type="text" name="confirmPassword" id="">
                            </div>
                            
                            <button type="submit" class="btn btn-primary">Salvar alterações</button>
                        </form>
                    </div>
                    <!-- end users -->
                </div>
            </div>
            <!-- end principal -->
        </main>
        <!-- end main -->

        <!-- start scripts -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        
        <!-- scripts para carregar o list group -->
        <script src="../js/adminPortal.js"></script>
        <script>
            async function loadListGroup() {
                const response = await fetch("../components/adminPortal.html"); // pedindo o adminPortal
                const data = await response.text();                             // converte o pedido para texto HTML
                document.getElementById("listGroup").innerHTML = data;          // injetando o adminPortal.html
                
                initListGroup();
            }

            // Chamando a função assim que carrega a página
            loadListGroup(); 
        </script>
        <!-- end scripts -->
    </body>
</html>
